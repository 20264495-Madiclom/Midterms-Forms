<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Madiclom - HTML Form Activity".</title>
</head> 
<body> 
<h1>HTML Form</h1> 
<form action="#" method="post"> 
<fieldset> 
    <legend>Personal Information</legend> 
        <label for = "Name"> Name:</label>
        <input type = "text" id="Name"> <br>
        <br>
        <label for = "email"> E-mail: </label>
        <input email = "email" id="email">
</fieldset> 
<br>
<fieldset> 
    <legend>Gender</legend> 
    <input type="radio" id="Female"  name="gender" value="Female"> 
    <label for="Female">Female</label><br> 
    <input type="radio" id="Male" name="gender" value="Male"> 
    <label for="Male">Male</label><br> 
    <input type="radio" id="Others" name="gender" value="gender"> 
    <label for="others">Others</label><br> 
</fieldset> 
<br>
<fieldset>
    <legend>Hobbies</legend> 
    <input type="checkbox" id="hobby1" name="Running" value="Running"> 
    <label for="vehicle1"> I have a bike</label><br> 
    <input type="checkbox" id="hobby2" name="Drawing" value="Drawing"> 
    <label for="vehicle2"> I have a car</label><br> 
    <input type="checkbox" id="hobby3" name="Diving" value="Diving"> 
    <label for="vehicle3"> I have a boat</label><br><br> 
</fieldset> 
<br>
<label for = "comment" >Comment</label><br>
<textarea id="comment" rows="3" cols="25">  </textarea><br>
<input type="submit" value="Submit">

</form> 
</body> 
</html>
